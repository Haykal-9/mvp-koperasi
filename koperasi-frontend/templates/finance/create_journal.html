{{define "content"}}
<div class="mb-4">
    <a href="/finance/journals" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left"></i> Kembali ke jurnal</a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-journal-plus text-success"></i> Input Jurnal Manual
            </div>
            <div class="card-body">
                <div class="alert alert-info small">
                    <i class="bi bi-info-circle"></i>
                    Jurnal dari transaksi simpanan, penjualan, dan pinjaman dicatat otomatis. Gunakan form ini untuk mencatat jurnal manual (pembelian ATK, biaya operasional, dll).
                </div>

                <form method="POST" action="/finance/journals/create">
                    <div class="mb-3">
                        <label for="tanggal" class="form-label fw-semibold">Tanggal <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="tanggal" name="tanggal" required>
                    </div>

                    <div class="mb-3">
                        <label for="keterangan" class="form-label fw-semibold">Keterangan <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="keterangan" name="keterangan" placeholder="Contoh: Pembelian ATK kantor" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="akun_debit" class="form-label fw-semibold">Akun Debit <span class="text-danger">*</span></label>
                            <select class="form-select" id="akun_debit" name="akun_debit" required>
                                <option value="">— Pilih Akun —</option>
                                <option value="Kas">Kas</option>
                                <option value="Piutang Anggota">Piutang Anggota</option>
                                <option value="Beban Operasional">Beban Operasional</option>
                                <option value="Beban Gaji">Beban Gaji</option>
                                <option value="Perlengkapan">Perlengkapan</option>
                                <option value="Peralatan">Peralatan</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="akun_kredit" class="form-label fw-semibold">Akun Kredit <span class="text-danger">*</span></label>
                            <select class="form-select" id="akun_kredit" name="akun_kredit" required>
                                <option value="">— Pilih Akun —</option>
                                <option value="Kas">Kas</option>
                                <option value="Pendapatan Penjualan">Pendapatan Penjualan</option>
                                <option value="Pendapatan Bunga">Pendapatan Bunga</option>
                                <option value="Simpanan Pokok">Simpanan Pokok</option>
                                <option value="Simpanan Wajib">Simpanan Wajib</option>
                                <option value="Simpanan Sukarela">Simpanan Sukarela</option>
                                <option value="Hutang">Hutang</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="nominal" class="form-label fw-semibold">Nominal <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text">Rp</span>
                            <input type="number" class="form-control" id="nominal" name="nominal" min="1" placeholder="250000" required>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success flex-grow-1">
                            <i class="bi bi-check-circle"></i> Simpan Jurnal
                        </button>
                        <a href="/finance/journals" class="btn btn-outline-secondary">Batal</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}}
