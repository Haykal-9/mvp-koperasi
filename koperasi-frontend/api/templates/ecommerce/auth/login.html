{{define "content"}}
<form method="POST" action="/ecommerce/login">
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" name="email"
                   value="{{.FormEmail}}" placeholder="Email akun Koperasi" required autofocus>
        </div>
    </div>
    <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Password akun Koperasi" required>
        </div>
    </div>
    <button type="submit" class="btn btn-primary w-100 mb-3">
        Masuk ke akun
    </button>
</form>
<div style="font-size: 16px;">
    <p class="mb-2">Belum punya akun? <a href="/ecommerce/signup" class="ec-link">Daftar di sini</a></p>
    <p class="mb-0" style="color: var(--zp-body-mid);">
        <a href="/login" class="ec-link"><i class="bi bi-arrow-left-right me-1"></i>Akses Koperasi</a>
    </p>
</div>
<div class="mt-4 p-3" style="background: var(--zp-canvas-soft); border-radius: 12px; border-left: 3px solid var(--zp-primary);">
    <span style="color: var(--zp-ink); font-size: 14px;">
        <i class="bi bi-info-circle me-1"></i>
        Gunakan email & password yang sama dengan akun Manajemen Koperasi.
    </span>
</div>
{{end}}
