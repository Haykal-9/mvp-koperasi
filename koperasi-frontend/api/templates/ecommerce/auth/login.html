{{define "content"}}
<h5 class="mb-3">Login E-Commerce</h5>
<form method="POST" action="/ecommerce/login">
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" name="email"
                   value="{{.FormEmail}}" placeholder="Email akun Koperasi" required autofocus>
        </div>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Password akun Koperasi" required>
        </div>
    </div>
    <button type="submit" class="btn btn-ec-primary w-100 py-2 mb-3">
        <i class="bi bi-box-arrow-in-right me-1"></i> Login
    </button>
</form>
<div class="text-center small">
    <p class="mb-1">Belum punya akun? <a href="/ecommerce/signup" class="ec-link">Daftar di sini</a></p>
    <p class="text-muted mb-0">
        <a href="/login" class="ec-link"><i class="bi bi-arrow-left-right me-1"></i>Akses Koperasi</a>
    </p>
</div>
<div class="mt-3 p-2 rounded" style="background: rgba(124,58,237,.1); border: 1px solid rgba(124,58,237,.2);">
    <small class="text-muted">
        <i class="bi bi-info-circle me-1"></i>
        Gunakan email dan password yang sama dengan akun Manajemen Koperasi Anda.
    </small>
</div>
{{end}}
