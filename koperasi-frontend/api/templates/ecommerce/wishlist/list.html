{{define "content"}}
<h5 class="mb-3"><i class="bi bi-heart me-1"></i>Wishlist Saya</h5>

{{if .Products}}
<div class="row g-3">
    {{range .Products}}
    <div class="col-6 col-md-4 col-lg-3">
        <div class="ec-card h-100">
            <img src="{{.FotoURL}}" class="card-img-top" alt="{{.Nama}}" style="height:180px;object-fit:cover;border-radius:.75rem .75rem 0 0;">
            <div class="p-3">
                <small class="text-muted">{{.SellerName}}</small>
                <h6 class="mt-1 mb-1" style="font-size:.9rem;">
                    <a href="/ecommerce/products/{{.ID}}" class="text-white text-decoration-none">{{.Nama}}</a>
                </h6>
                <div class="d-flex align-items-center gap-2 mb-2">
                    <span class="text-warning small"><i class="bi bi-star-fill"></i> {{printf "%.1f" .Rating}}</span>
                    <strong class="small" style="color:#a78bfa;">Rp {{printf "%.0f" .Harga}}</strong>
                </div>
                <form method="POST" action="/ecommerce/wishlist/toggle">
                    <input type="hidden" name="product_id" value="{{.ID}}">
                    <button type="submit" class="btn btn-sm btn-outline-danger w-100">
                        <i class="bi bi-heart-fill me-1"></i>Hapus
                    </button>
                </form>
            </div>
        </div>
    </div>
    {{end}}
</div>
{{else}}
<div class="ec-card p-4 text-center">
    <i class="bi bi-heart" style="font-size:3rem;color:rgba(255,255,255,.15);"></i>
    <p class="text-muted mt-2 mb-3">Wishlist Anda masih kosong.</p>
    <a href="/ecommerce/products" class="btn btn-sm btn-ec-primary"><i class="bi bi-grid me-1"></i>Jelajahi Produk</a>
</div>
{{end}}
{{end}}
