{{define "content"}}
<h5 class="mb-3"><i class="bi bi-plus-square me-1"></i>Tambah Produk Baru</h5>

<div class="ec-card p-4">
    <form method="POST" action="/ecommerce/seller/products/create">
        <div class="row g-3">
            <div class="col-md-8">
                <label for="nama" class="form-label">Nama Produk <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="nama" name="nama" placeholder="Contoh: Kopi Arabika Premium 250g" required>
            </div>
            <div class="col-md-4">
                <label for="kategori" class="form-label">Kategori <span class="text-danger">*</span></label>
                <select class="form-select" id="kategori" name="kategori" required>
                    <option value="">Pilih Kategori</option>
                    {{range .Categories}}
                    <option value="{{.}}">{{.}}</option>
                    {{end}}
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>
            <div class="col-12">
                <label for="deskripsi" class="form-label">Deskripsi</label>
                <textarea class="form-control" id="deskripsi" name="deskripsi" rows="3" placeholder="Deskripsikan produk Anda..."></textarea>
            </div>
            <div class="col-md-4">
                <label for="harga" class="form-label">Harga (Rp) <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="harga" name="harga" min="1" placeholder="50000" required>
            </div>
            <div class="col-md-4">
                <label for="stok" class="form-label">Stok</label>
                <input type="number" class="form-control" id="stok" name="stok" min="0" value="0" placeholder="10">
            </div>
            <div class="col-md-4">
                <label for="berat" class="form-label">Berat (gram)</label>
                <input type="number" class="form-control" id="berat" name="berat" min="0" value="0" placeholder="500">
            </div>
        </div>

        <div class="mt-3 p-2 rounded small" style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.15);">
            <i class="bi bi-info-circle text-warning me-1"></i>
            Produk baru akan berstatus <strong>Pending Approval</strong> dan perlu disetujui admin sebelum tampil di katalog.
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-ec-primary"><i class="bi bi-check-lg me-1"></i>Simpan Produk</button>
            <a href="/ecommerce/seller/products" class="btn btn-outline-light">Batal</a>
        </div>
    </form>
</div>
{{end}}
